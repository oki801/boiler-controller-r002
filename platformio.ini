; ESP32 bojlervezerlo - PlatformIO konfiguracio
[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_ldf_mode = chain+

; ESP32-S3-WROOM-1 N16R8: 16 MB quad flash + 8 MB octal PSRAM, ketmagos LX7, nativ USB
[env:esp32s3]
platform = espressif32@6.9.0        ; Arduino-ESP32 2.0.x (S3 tamogatassal)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM (N16R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv
board_build.filesystem = littlefs
upload_speed = 921600
extra_scripts =
  pre:scripts/version.py
  pre:scripts/embed_ui.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude
  -I.pio/libdeps/${PIOENV}/ArduinoJson/src
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1            ; beepitett USB (soros konzol + JTAG), a GPIO19/20 ezert foglalt
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@7.2.0
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.9.1
  https://github.com/mandulaj/PZEM-004T-v30.git#v1.2.1
  knolleary/PubSubClient@2.8
  mathieucarbou/ESPAsyncWebServer@3.6.0
  mathieucarbou/AsyncTCP@3.3.2
  adafruit/Adafruit GFX Library@1.13.0
  adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
  adafruit/Adafruit BusIO@1.17.4

; Halozaton keresztuli feltoltes:  OTA_PASSWORD=... pio run -e ota -t upload
[env:ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = bojler.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}

; PC-s unit tesztek (hardver nelkul):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_unflags =
build_flags = -std=gnu++17 -Wall -DNATIVE_BUILD
lib_ignore = Hal, Sensors, Comms, Storage, App
