<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Boiler Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:Segoe UI,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    padding:20px;
}

.app{
    width:100%;
    max-width:430px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.thermostat{
    width:300px;
    height:300px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
    transition:.4s;
    box-shadow:
    0 0 20px rgba(255,255,255,.05),
    inset 0 0 10px rgba(255,255,255,.08);
}

.inner{
    width:246px;
    height:246px;
    border-radius:50%;
    background:linear-gradient(
    180deg,
    #1b2434,
    #111827
    );

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    box-shadow:
    inset 0 2px 10px rgba(255,255,255,.05),
    0 2px 20px rgba(0,0,0,.4);
}

.tempRow{
    display:flex;
    align-items:center;
    gap:10px;
}

.temp{
    font-size:65px;
    font-weight:700;
}

.state{
    min-width:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.status{
    margin-top:10px;
    color:#cbd5e1;
}

.slider{
    width:100%;
    margin-top:20px;
    appearance:none;
    height:8px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #2563eb,
        #22c55e,
        #facc15,
        #f97316,
        #ef4444
    );
}

.slider::-webkit-slider-thumb{
    appearance:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:white;
    cursor:pointer;
    box-shadow:0 0 10px rgba(255,255,255,.5);
}

.menu{
    margin-top:16px;
    display:flex;
    justify-content:space-around;
    background:#111827;
    border-radius:18px;
    padding:15px;
}

.menu div{
    cursor:pointer;
    font-size:26px;
}

.led{
    width:28px;
    height:28px;
    border-radius:50%;
    background:
    radial-gradient(circle at 35% 35%,#d8ffd8,#00ff66);

    box-shadow:
    0 0 10px #00ff66,
    0 0 20px #00ff66,
    0 0 35px #00ff66;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.15);
    }
}

.setting{
    margin-bottom:20px;
}

button{
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-size:16px;
    color:white;
    cursor:pointer;
}

#saveBtn{
    background:#3b82f6;
}

.logItem,
.errorItem{
    background:#0f172a;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<div id="home" class="page active">

<div class="card">

<div id="ring" class="thermostat">

<div class="inner">

<div class="tempRow">

<div id="tempText" class="temp">55</div>

<div>°C</div>

<div id="state" class="state">😊</div>

</div>

<div id="status" class="status">
Hőfok rendben
</div>

</div>

</div>

<input
id="tempSlider"
class="slider"
type="range"
min="0"
max="60"
value="55">

</div>

</div>

<div id="log" class="page">

<div class="card">
<h2>📜 Napló</h2>

<div class="logItem">
♨️ Fűtés elindult
</div>

<div class="logItem">
😊 Célhőmérséklet elérve
</div>

</div>

</div>

<div id="errors" class="page">

<div class="card">
<h2>⚠️ Hibák</h2>

<div class="errorItem">
✅ Nincs aktív hiba
</div>

</div>

</div>

<div id="settings" class="page">

<div class="card">

<h2>⚙️ Beállítások</h2>

<div class="setting">

<label>
Hiszterézis:
<span id="hystValue">2</span> °C
</label>

<input
id="hystSlider"
class="slider"
type="range"
min="0.5"
max="10"
step="0.5"
value="2">

</div>

<button id="saveBtn"
onclick="saveSettings()">
✅ Mentve
</button>

</div>

</div>

<div class="menu">
<div onclick="showPage('home')">🏠</div>
<div onclick="showPage('log')">📜</div>
<div onclick="showPage('errors')">⚠️</div>
<div onclick="showPage('settings')">⚙️</div>
</div>

</div>

<script>

function showPage(page){
    document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

    document.getElementById(page)
    .classList.add("active");
}

const slider=document.getElementById("tempSlider");
const hystSlider=document.getElementById("hystSlider");

const tempText=document.getElementById("tempText");
const state=document.getElementById("state");
const status=document.getElementById("status");
const ring=document.getElementById("ring");

const saveBtn=document.getElementById("saveBtn");

const savedTemp=localStorage.getItem("targetTemp");
const savedHyst=localStorage.getItem("hysteresis");

if(savedTemp!==null){
    slider.value=savedTemp;
}

if(savedHyst!==null){
    hystSlider.value=savedHyst;
    document.getElementById("hystValue").innerHTML=savedHyst;
}

function colorFromTemp(temp){

    let hue=220-(temp/60)*220;

    return `hsl(${hue},90%,55%)`;
}

function updateDisplay(){

    let target=parseFloat(slider.value);
    let hyst=parseFloat(hystSlider.value);

    if(target===0){

        tempText.innerHTML="⏻";
        state.innerHTML="";
        status.innerHTML="Kikapcsolva";

        ring.style.background=
        "conic-gradient(#4b5563 0deg,#4b5563 360deg)";

        return;
    }

    tempText.innerHTML=Math.round(target);

    const color=colorFromTemp(target);

    const angle=(target/60)*360;

    ring.style.background=
    `conic-gradient(
      ${color} 0deg,
      ${color} ${angle}deg,
      #253142 ${angle}deg,
      #253142 360deg
    )`;

    if(target < (55-hyst)){

        state.innerHTML="♨️";
        status.innerHTML="Felfűtés folyamatban";

    }
    else if(target < 55){

        state.innerHTML='<div class="led"></div>';
        status.innerHTML="Várakozás";

    }
    else{

        state.innerHTML="😊";
        status.innerHTML="Hőfok rendben";
    }
}

slider.addEventListener("input",()=>{

    saveBtn.style.background="#22c55e";
    saveBtn.innerHTML="💾 Mentés";

    updateDisplay();
});

hystSlider.addEventListener("input",()=>{

    document.getElementById("hystValue").innerHTML=
    hystSlider.value;

    saveBtn.style.background="#22c55e";
    saveBtn.innerHTML="💾 Mentés";

    updateDisplay();
});

function saveSettings(){

    localStorage.setItem(
        "targetTemp",
        slider.value
    );

    localStorage.setItem(
        "hysteresis",
        hystSlider.value
    );

    saveBtn.style.background="#3b82f6";
    saveBtn.innerHTML="✅ Mentve";
}

updateDisplay();

</script>

</body>
</html>
